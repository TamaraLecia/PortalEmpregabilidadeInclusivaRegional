<!DOCTYPE html>
<html lang="ptbr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="icon"
  type="image/png"
  href="imagens/acessibilidade.png"
  >
  <link rel="stylesheet" href="css/CriarContaAdministrador.css">
</head>

<header class="header">
  <div class="logo">
    <img src="imagens/acessibilidade.png" alt="Ícone de Acessibilidade" class="logo-icon">
    <h1>Portal de Empregabilidade Inclusiva Regional</h1>
  </div>
  <nav class="menu">
    <a href="TelaInicio.html">Inicio</a>
    <a href="Sobre.html">Sobre</a>
  </nav>

</header>
<div class="container">
    <div class="left-panel">
      <div class="logo">
        <h1>FAÇA SEU CADASTRO</h1>
        <img src="imagens/acessibilidade.png" alt="acessibilidade">
      </div>
    </div>

    <div class="right-panel">
      <form id="formAdm" action="insert">
        <div class="input-group">
          <label for="nome">Nome <span>*</span></label>
          <div class="input-wrapper">
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome">
          </div>
        </div>
        <div class="input-group">
          <label for="telefone">Telefone <span>*</span></label>
          <div class="input-wrapper">
            <input type="text" name="telefone" id="telefone" placeholder="Digite seu telefone">
          </div>
        </div>
        <div class="input-group">
          <label for="email">E-mail <span>*</span></label>
          <div class="input-wrapper">
            <input type="email" name="email" id="email" placeholder="Digite seu e-mail">
          </div>
        </div>
        <div class="input-group">
          <label for="senha">Senha <span>*</span></label>
          <div class="input-wrapper">
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha">
          </div>
        </div>
        <input type="button" value="Cadastrar" class="btn" onclick="validarInformacao()">
      </form>
    </div>
  </div>
  <script src="scripts/adm.js"></script>
</body>
</html>
