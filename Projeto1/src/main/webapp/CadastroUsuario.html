<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"
  type="image/png"
  href="imagens/acessibilidade.png"
  >
  <link rel="stylesheet" href="css/cadastroUsuario.css">
 
  <title>Formulário de Cadastro</title>
</head>
<body>

  <div class="container">
    <div class="sidebar">
      <div class="accessibility-icon">
        <img src="imagens/acessibilidade.png" alt="Acessibilidade" class="accessibility-icon">
      </div>
      <h2>CONCLUA SEU CADASTRO</h2>
    </div>
    <div class="form-container" >
      <form id = "formCadastro" action="insert">
      <div class="input-group">
          <label for="nome">Nome <span>*</span></label>
          <div class="input-wrapper">
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome">
          </div>
        </div>
        <div class="input-group">
          <label for="telefone">Telefone <span>*</span></label>
          <div class="input-wrapper">
            <input type="text" name="telefone" id="telefone" placeholder="Digite seu telefone">
          </div>
        </div>
        <div class="input-group">
          <label for="email">E-mail <span>*</span></label>
          <div class="input-wrapper">
            <input type="email" name="email" id="email" placeholder="Digite seu e-mail">
          </div>
        </div>
        <div class="input-group">
          <label for="senha">Senha <span>*</span></label>
          <div class="input-wrapper">
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha">
          </div>
        </div>
        <label for=interesse">Qual sua área de interesse profissional? *</label>
        <input type="text" id="interesse" name="interesse" placeholder="Digite sua área de interesse" required>

        <label for="genero">Gênero *</label>
        <input type="text" id="genero" name="genero" placeholder="Informe seu gênero" required>

        <label for="dataNascimento">Data de nascimento *</label>
        <input type="date" id="dataNascimento" name="dataNascimento" required>

        <label for="nacionalidade">Nacionalidade *</label>
        <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Informe sua nacionalidade" required>

        <label for="endereco">Endereço *</label>
        <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço" required>

        <label for="formacao">Formação acadêmica *</label>
        <input type="text" id="formacao" name="formacao" placeholder="Informe sua formação acadêmica" required>

        <label for="cpf">CPF *</label>
        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>

        <label for="deficiencia">Você possui alguma deficiência? Se sim, qual? *</label>
        <input type="text" id="deficiencia" name="deficiencia" placeholder="Descreva sua deficiência" required>

        <label for="descricao">Se a resposta anterior foi sim, descreva informações sobre sua condição e se há alguma adaptação necessária para o ambiente de trabalho?". *</label>
        <textarea id="descricao" name="descricao" placeholder="Informe os detalhes" required></textarea>
        
        <input type="button" href="concluido" value="Cadastrar" class="btn" onclick="validarinformacoes() ">

       <!-- <button type="submit" id="btnCadastrar">Cadastrar</button> -->
        
      </form>
    </div>
  </div>
  <script src="scripts/validador.js"></script>
</body>
</html>
