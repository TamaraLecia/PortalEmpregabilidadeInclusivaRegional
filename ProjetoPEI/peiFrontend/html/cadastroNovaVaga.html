<!DOCTYPE html>
<html lang="ptbr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Nova Vaga</title>
  <link rel="icon" type="image/png" href="acessibilidade.png">
  <link rel="stylesheet" href="../css/cadastroNovaVaga.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="acessibilidade.png" alt="Ícone de Acessibilidade" class="logo-icon">
      <h1>Portal de Empregabilidade Inclusiva Regional</h1>
    </div>
    <nav class="menu">
      <a href="TelaInicio.html">Início</a>
      <a href="Sobre.html">Sobre</a>
      <a href="Login.html">Login</a>
      <a href="CriarConta.html">Criar Conta</a>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Cadastrar Nova Vaga</h2>
      <p>Preencha as informações abaixo para disponibilizar uma nova oportunidade em nossa plataforma:</p>
      <form>
        <label for="titulo">Título da Vaga *</label>
        <input type="text" id="titulo" name="titulo" placeholder="Exemplo: Desenvolvedor Web" required>

        <label for="descricao">Descrição da Vaga *</label>
        <textarea id="descricao" name="descricao" rows="5" placeholder="Descreva as principais atividades e responsabilidades da vaga." required></textarea>

        <label for="salario">Faixa Salarial *</label>
        <input type="text" id="salario" name="salario" placeholder="Exemplo: R$ 3.000 - R$ 5.000" required>

        <label for="tipo-contrato">Tipo de Contrato *</label>
        <select id="tipo-contrato" name="tipo-contrato" required>
          <option value="" disabled selected>Selecione...</option>
          <option value="CLT">CLT</option>
          <option value="Estágio">Estágio</option>
          <option value="Temporário">Temporário</option>
          <option value="PJ">Pessoa Jurídica</option>
        </select>

        <label for="local">Local de Trabalho *</label>
        <input type="text" id="local" name="local" placeholder="Exemplo: São Paulo - SP ou Remoto" required>

        <label for="requisitos">Requisitos da Vaga *</label>
        <textarea id="requisitos" name="requisitos" rows="4" placeholder="Informe os requisitos necessários para a vaga." required></textarea>

        <label for="beneficios">Benefícios *</label>
        <textarea id="beneficios" name="beneficios" rows="4" placeholder="Informe os benefícios oferecidos pela vaga." required></textarea>

        <div class="button">
            <a href="cadastroParaVagaConcluido.html">
                <button class="button">Cadastrar vaga</button>
            </a>
          <button type="reset">Limpar Campos</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2024 Portal de Empregabilidade Inclusiva. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
