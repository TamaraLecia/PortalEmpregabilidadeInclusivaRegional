
<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon"
    type="image/png"
    href="acessibilidade.png"
    >
    <link rel="stylesheet" href="../css/styleLogin.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo">
                <img src="acessibilidade.png" alt="Acessibilidade">
            </div>
            <h1>FAÇA SEU LOGIN</h1>
            <a href="PjPf.html" class="criar-conta">CRIAR CONTA</a>
        </div>
        <div class="right-panel">
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail<span>*</span></label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Senha<span>*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required>
                    </div>
                    <a href="#" class="esqueceu-password">Esqueceu a senha</a>
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
