<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Perfil</title>
  <link rel="icon" type="image/png" href="acessibilidade.png">
  <link rel="stylesheet" href="../css/EditarPerfilUsuario.css">
</head>
<body>
  <aside>
    <h2>Menu</h2>
    <ul>
      <li><a href="EditarPerfilUsuario.html" class="active">Editar Perfil</a></li>
      <li><a href="PerfilUsuario.html">Meu perfil</a></li>
      <li><a href="#">Vagas Cadastradas</a></li>
      <li><a href="#">Sair</a></li>
    </ul>
  </aside>

  <main>
    <header class="header">
      <div class="logo">
        <img src="acessibilidade.png" alt="Ícone de Acessibilidade" class="logo-icon">
        <h1>Portal de Empregabilidade Inclusiva</h1>
      </div>
      <nav class="menu">
        <a href="TelaInicio.html">Início</a>
        <a href="Sobre.html">Sobre</a>
      </nav>
    </header>

    <hr class="divider">

    <section class="content">
      <h2>Editar Perfil</h2>
      <form>
        <div class="form-group">
          <label for="area-interesse">Área de Interesse *</label>
          <input type="text" id="area-interesse" name="area-interesse" placeholder="Digite sua área de interesse profissional" required>
        </div>

        <div class="form-group">
          <label for="genero">Gênero *</label>
          <input type="text" id="genero" name="genero" placeholder="Digite seu gênero" required>
        </div>

        <div class="form-group">
          <label for="data-nascimento">Data de Nascimento *</label>
          <input type="date" id="data-nascimento" name="data-nascimento" required>
        </div>

        <div class="form-group">
          <label for="nacionalidade">Nacionalidade *</label>
          <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Digite sua nacionalidade" required>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço *</label>
          <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço" required>
        </div>

        <div class="form-group">
          <label for="formacao-academica">Formação Acadêmica *</label>
          <input type="text" id="formacao-academica" name="formacao-academica" placeholder="Digite sua formação acadêmica" required>
        </div>

        <div class="form-group">
          <label for="deficiencia">Deficiência *</label>
          <input type="text" id="deficiencia" name="deficiencia" placeholder="Informe se possui alguma deficiência" required>
        </div>

        <div class="form-group">
          <label for="descricao-deficiencia">Descrição sobre a Deficiência *</label>
          <textarea id="descricao-deficiencia" name="descricao-deficiencia" rows="4" placeholder="Descreva a deficiência brevemente" required></textarea>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn">Salvar Alterações</button>
          <button type="reset" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </section>

    <footer class="footer">
      <p>&copy; 2024 Portal de Empregabilidade Inclusiva Regional. Todos os direitos reservados.</p>
    </footer>
  </main>
</body>
</html>
