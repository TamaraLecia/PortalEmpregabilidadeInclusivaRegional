<!DOCTYPE html>
<html lang="ptbr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar perfil</title>
  <link rel="icon"
  type="image/png"
  href="acessibilidade.png"
  >
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
  <link rel="stylesheet" href="../css/EditarPerfilUsuario.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="acessibilidade.png" alt="Logo do Portal de Empregabilidade Inclusiva Regional">
      <h1>Portal de Empregabilidade Inclusiva Regional</h1>
    </div>
  </header>
  <main>
    <form class="form split-form">
      <div class="form-column">
        <div class="form-group">
          <label for="nome">
            <span class="icon">👤</span>
            Nome
          </label>
          <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
          <label for="data-nascimento">
            <span class="icon">📅</span>
            Data de nascimento
          </label>
          <input type="date" id="data-nascimento">
        </div>

        <div class="form-group">
          <label for="cpf">
            <span class="icon">📋</span>
            CPF
          </label>
          <input type="text" id="cpf" placeholder="Digite seu CPF">
        </div>

        <div class="form-group">
          <label for="genero">
            <span class="icon">⚥</span>
            Gênero
          </label>
          <input type="text" id="genero" placeholder="Digite seu gênero">
        </div>

        <div class="form-group">
          <label for="endereco">
            <span class="icon">📍</span>
            Endereço
          </label>
          <input type="text" id="endereco" placeholder="Digite seu endereço">
        </div>

        <div class="form-group">
          <label for="nacionalidade">
            <span class="icon">🏳</span>
            Nacionalidade
          </label>
          <input type="text" id="nacionalidade" placeholder="Digite sua nacionalidade">
        </div>
      </div>

      <div class="form-column">
        <div class="form-group">
          <label for="deficiencia">
            <span class="icon">👤</span>
            Portador(a) de qual deficiência
          </label>
          <input type="text" id="deficiencia" placeholder="Descreva sua deficiência">
        </div>

        <div class="form-group">
          <label for="area-interesse">
            <span class="icon">💼</span>
            Qual sua área de interesse profissional
          </label>
          <input type="text" id="area-interesse" placeholder="Digite sua área de interesse">
        </div>

        <div class="form-group">
          <label for="formacao">
            <span class="icon">🎓</span>
            Formação acadêmica
          </label>
          <input type="text" id="formacao" placeholder="Digite sua formação acadêmica">
        </div>

        <div class="form-group">
          <label for="adaptacao">
            <span class="icon">📅</span>
            Descreva a sua deficiência e se precisa de alguma adaptação no trabalho
          </label>
          <textarea id="adaptacao" placeholder="Digite informações adicionais"></textarea>
        </div>
      </div>

      <button type="submit">Salvar alterações</button>
    </form>
  </main>
</body>
</html>
