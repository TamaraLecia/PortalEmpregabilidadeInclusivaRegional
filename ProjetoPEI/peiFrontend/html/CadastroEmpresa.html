<!DOCTYPE html>
<html lang="ptbr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro da Empresa</title>
  <link rel="icon"
  type="image/png"
  href="acessibilidade.png"
  >
  <link rel="stylesheet" href="../css/cadastroEmpresa.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="icon-wrapper">
        <img src="acessibilidade.png" alt="Acessibilidade" class="accessibility-icon">
      </div>
      <h2>Cadastre sua empresa</h2>
    </div>
    <div class="form-container">
      <form>
        <label for="nome">Nome da empresa *</label>
        <input type="text" id="nome" name="nome" required>

        <label for="cnpj">CNPJ *</label>
        <input type="text" id="cnpj" name="cnpj" required>

        <label for="setor">Setor de atuação da empresa *</label>
        <input type="text" id="setor" name="setor" required>

        <label for="site">Site oficial da empresa *</label>
        <input type="url" id="site" name="site" required>

        <label for="endereco">Endereço completo *</label>
        <input type="text" id="endereco" name="endereco" required>

        <label for="regiao">Regiões de atuação *</label>
        <input type="text" id="regiao" name="regiao" required>

        <label for="inclusao">Possui programas de inclusão para PCDs? *</label>
        <input type="text" id="inclusao" name="inclusao" required>

        <label for="tipo-vaga">Tipo da vaga ofertada *</label>
        <input type="text" id="tipo-vaga" name="tipo-vaga" required>

        <label for="descricao-vagas">Descreva quais as vagas ofertadas e suas funções *</label>
        <textarea id="descricao-vagas" name="descricao-vagas" rows="5" required></textarea>

        <button type="submit">Cadastrar</button>
      </form>
    </div>
  </div>
</body>
</html>
