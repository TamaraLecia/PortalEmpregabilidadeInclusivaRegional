<!DOCTYPE html>
<html lang="ptbr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de usuário</title>
  <link rel="icon"
  type="image/png"
  href="acessibilidade.png"
  >
  <link rel="stylesheet" href="../css/PerfilUsuario.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="acessibilidade.png" alt="Logo do Portal de Empregabilidade Inclusiva Regional">
      <h1>Portal de Empregabilidade Inclusiva Regional</h1>
    </div>
  </header>
  <main>
    <form class="form">
      <div class="form-group">
        <label for="nome">
          <span class="icon">👤</span>
          Nome
        </label>
        <input type="text" id="nome" placeholder="Digite seu nome">
      </div>

      <div class="form-group">
        <label for="formacao">
          <span class="icon">🎓</span>
          Formação acadêmica
        </label>
        <input type="text" id="formacao" placeholder="Digite sua formação acadêmica">
      </div>

      <div class="form-group">
        <label for="area">
          <span class="icon">💼</span>
          Área de interesse profissional
        </label>
        <input type="text" id="area" placeholder="Digite sua área de interesse">
      </div>

      <div class="form-group">
        <label for="sobre">
          <span class="icon">📅</span>
          Sobre
        </label>
        <textarea id="sobre" placeholder="Digite informações adicionais"></textarea>
      </div>

      <button type="submit">Editar informações <a href="EditarPerfilUsuario.html"></a></button>
    </form>
  </main>
  <script src="../js/script.js"></script>
</body>
</html>
