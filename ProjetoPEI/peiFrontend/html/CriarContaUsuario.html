<!DOCTYPE html>
<html lang="ptbr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="icon"
  type="image/png"
  href="acessibilidade.png"
  >
  <link rel="stylesheet" href="../css/CriarContaUsuario.css">
</head>
<div class="container">
    <div class="left-panel">
      <div class="logo">
        <h1>FAÇA SEU CADASTRO</h1>
        <img src="acessibilidade.png" alt="acessibilidade">
      </div>
    </div>

    <div class="right-panel">
      <form>
        <div class="input-group">
          <label for="nome">Nome <span>*</span></label>
          <div class="input-wrapper">
            <input type="text" id="nome" placeholder="Digite seu nome">
          </div>
        </div>
        <div class="input-group">
          <label for="telefone">Telefone <span>*</span></label>
          <div class="input-wrapper">
            <input type="text" id="telefone" placeholder="Digite seu telefone">
          </div>
        </div>
        <div class="input-group">
          <label for="email">E-mail <span>*</span></label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="Digite seu e-mail">
          </div>
        </div>
        <div class="input-group">
          <label for="senha">Senha <span>*</span></label>
          <div class="input-wrapper">
            <input type="password" id="senha" placeholder="Digite sua senha">
          </div>
        </div>
        <a href="CadastroUsuario.html" class="btn">Cadastrar</a>
      </form>
    </div>
  </div>
</body>
</html>
