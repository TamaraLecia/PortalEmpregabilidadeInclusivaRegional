<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil da Empresa</title>
  <link rel="icon" type="image/png" href="acessibilidade.png">
  <link rel="stylesheet" href="../css/PerfilEmpresa.css">
</head>
<body>
  <aside>
    <h2>Menu</h2>
    <ul>
      <li><a href="EditarPerfilEmpresa.html" class="active">Editar Perfil</a></li>
      <li><a href="VagasOfertadas.html">Minhas Vagas</a></li>
      <li><a href="#">Sair</a></li>
    </ul>
  </aside>

  <main>
    <header class="header">
      <div class="logo">
        <img src="acessibilidade.png" alt="Ícone de Acessibilidade" class="logo-icon">
        <h1>Portal de Empregabilidade Inclusiva</h1>
      </div>
      <nav class="menu">
        <a href="TelaInicio.html">Início</a>
        <a href="Sobre.html">Sobre</a>
      </nav>
    </header>

    <hr class="divider">

    <section class="content">
      <h2>Perfil da Empresa</h2>
      <form>
        <div class="form-group">
          <label for="nome-empresa">Nome da Empresa:</label>
          <input type="text" id="nome-empresa" name="nome-empresa" value="Empresa Exemplo" disabled>
        </div>

        <div class="form-group">
          <label for="cnpj">CNPJ:</label>
          <input type="text" id="cnpj" name="cnpj" value="00.000.000/0001-00" disabled>
        </div>

        <div class="form-group">
          <label for="setor">Setor de Atuação:</label>
          <input type="text" id="setor" name="setor" value="Tecnologia da Informação" disabled>
        </div>

        <div class="form-group">
          <label for="site">Site Oficial:</label>
          <input type="text" id="site" name="site" value="www.empresaexemplo.com" disabled>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço:</label>
          <input type="text" id="endereco" name="endereco" value="Rua Principal, 123 - São Paulo, SP" disabled>
        </div>

        <div class="form-group">
          <label for="regioes">Regiões de Atuação:</label>
          <input type="text" id="regioes" name="regioes" value="Sudeste, Sul" disabled>
        </div>

        <div class="form-group">
          <label for="programa-inclusao">Possui Programas de Inclusão?</label>
          <input type="text" id="programa-inclusao" name="programa-inclusao" value="Sim" disabled>
        </div>

        <div class="form-group">
          <label for="descricao-vagas">Descrição das Vagas Ofertadas:</label>
          <textarea id="descricao-vagas" name="descricao-vagas" rows="4" disabled>
Desenvolvedor de Software com foco em acessibilidade e suporte técnico.
          </textarea>
        </div>
      </form>
    </section>

    <footer class="footer">
      <p>&copy; 2024 Portal de Empregabilidade Inclusiva Regional. Todos os direitos reservados.</p>
    </footer>
  </main>
</body>
</html>
