<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Usuário</title>
  <link rel="icon" type="image/png" href="acessibilidade.png">
  <link rel="stylesheet" href="../css/PerfilUsuario.css">
</head>
<body>
  <aside>
    <h2>Menu</h2>
    <ul>
      <li><a href="EditarPerfilUsuario.html" class="active">Editar perfil</a></li>
      <li><a href="vagasCadastradasUsuario.html">Vagas Cadastradas</a></li>
      <li><a href="#">Sair</a></li>
    </ul>
  </aside>

  <main>
    <header class="header">
      <div class="logo">
        <img src="acessibilidade.png" alt="Ícone de Acessibilidade" class="logo-icon">
        <h1>Portal de Empregabilidade Inclusiva</h1>
      </div>
      <nav class="menu">
        <a href="TelaInicio.html">Início</a>
        <a href="Sobre.html">Sobre</a>
      </nav>
    </header>

    <hr class="divider">

    <section class="content">
      <h2>Meu Perfil</h2>
      <form>
        <div class="form-group">
          <label for="area-interesse">Área de Interesse</label>
          <input type="text" id="area-interesse" value="Tecnologia da Informação" disabled>
        </div>

        <div class="form-group">
          <label for="genero">Gênero</label>
          <input type="text" id="genero" value="Masculino" disabled>
        </div>

        <div class="form-group">
          <label for="data-nascimento">Data de Nascimento</label>
          <input type="text" id="data-nascimento" value="15/06/1990" disabled>
        </div>

        <div class="form-group">
          <label for="nacionalidade">Nacionalidade</label>
          <input type="text" id="nacionalidade" value="Brasileiro" disabled>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" value="Rua Principal, 123 - São Paulo, SP" disabled>
        </div>

        <div class="form-group">
          <label for="formacao-academica">Formação Acadêmica</label>
          <input type="text" id="formacao-academica" value="Ciência da Computação" disabled>
        </div>

        <div class="form-group">
          <label for="deficiencia">Deficiência</label>
          <input type="text" id="deficiencia" value="Auditiva" disabled>
        </div>

        <div class="form-group">
          <label for="descricao-deficiencia">Descrição sobre a Deficiência</label>
          <textarea id="descricao-deficiencia" rows="4" disabled>
Tenho deficiência auditiva parcial e utilizo recursos tecnológicos para comunicação.
          </textarea>
        </div>
      </form>
    </section>

    <footer class="footer">
      <p>&copy; 2024 Portal de Empregabilidade Inclusiva Regional. Todos os direitos reservados.</p>
    </footer>
  </main>
</body>
</html>
