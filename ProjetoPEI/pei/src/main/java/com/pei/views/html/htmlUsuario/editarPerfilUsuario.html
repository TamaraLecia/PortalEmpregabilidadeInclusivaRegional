<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/ProjetoPEI/pei/src/main/java/com/pei/views/css/cssUsuario/editarPerfilUsuario.css">
    <script src="https://kit.fontawesome.com/94e4ba8057.js" crossorigin="anonymous"></script>
    <title>Editar Perfil do Usuário</title>
</head>
<body>
    <div class ="cabecalho"> 
        <header>
            <img src="/ProjetoPEI/pei/src/main/java/com/pei/views/imagemDoSistema/acessibilidade.png" alt="Um boneco pintado de preto" id="logo">
            <h1>Portal de Empregabilidade
                <br>
                Inclusiva Regional</h1>
        </header>
    </div>
    
    <div class="contanier">
        <div class="formulario">
            <form action="" method="post">
                <div class="grupoInput">
                    <div class="caixaInput" id="caixaInput">
                        <i class="fa-solid fa-user" title="boneco pintado de preto"></i>
                        <label for="nome">Nome</label>
                        <br>
                        <input type="text" name="" class="input" id="nome" required>
                    </div>

                    <div class="caixaInput" id="caixaInput">
                        <i class="fa-solid fa-user" title="icone de um boneco pintado de preto"></i>
                        <label for="data">Data de Nascimento</label>
                        <br>
                        <input type="date" name="" class="input" id="data" required>
                    </div>

                    <div class="caixaInput" id="caixaInput">
                        <i class="fa-solid fa-user" title="icone de um boneco pintado de preto"></i>
                        <label for="cpf">CPF</label>
                        <br>
                        <input type="number" name="" class="input" id="cpf" required>
                    </div>

                    <i class="fa-solid fa-venus-mars" id="iconeGenero" title="icone de genero"></i>
                    <div class="caixaInput" id="caixaGenero">
                        
                        <div class="genero">
                            
                            <h6>Gênero</h6>
                            <div class="generoInput" id="radio">
                                <input type="radio" name="genero" id="feminino" value="feminino">
                                <label for="feminino">Feminino</label>
                            </div>

                            <div class="generoInput" id="radio">
                                <input type="radio" name="genero" id="masculino" value="masculino">
                                <label for="masculino">Masculino</label>
                            </div>

                            <div class="generoInput" id="radio3">
                                <input type="radio" name="genero" id="outro" value="outro">
                                <label for="outro">Outro</label>
                            </div>
                       </div>
                    
                    </div>

                    <div class="caixaInput" id="endereco">
                        <i class="fa-solid fa-location-dot" title="icone do gps"></i>
                        <label for="endereco">Endereco</label>
                        <br>
                        <input type="text" name="" class="input" id="endereco" required>
                    </div>

                    <div class="caixaInput" id="nacionalidade">
                        <i class="fa-solid fa-flag" title="icone de bandeira pintada de preto"></i>
                        <label for="nacionalidade">Nacionalidade</label>
                        <br>
                        <input type="text" name="" class="input" id="nacionalidade" required>
                    </div>
                </div>
                <div class="grupoInput2">
                    <div class="caixaInput1">
                        <i class="fa-solid fa-user" title="icone de um boneco pintado de preto"></i>
                        <label for="deficiencia">Portador(a) de qual deficiência?</label>
                        <br>
                        <input type="text" name="" class="input" id="deficiencia" required>
                    </div>

                    <div class="caixaInput1">
                        <i class="fa-solid fa-suitcase"></i>
                        <label for="areaDeInteresseProfissional">Qual sua área de interesse profissional?</label>
                        <br>
                        <input type="text" name="" class="input" id="areaDeInteresseProfissional"/>
                    </div>

                    <div class="caixaInput1">
                        <i class="fa-solid fa-user-graduate" title="icone de um boneco com chapéu de formatura "></i>
                        <label for="formacaoacademica">Formação acadêmica</label>
                        <br>
                        <input type="text" name="" class="input" id="formacaoacademica"/>
                    </div>

                    <div class="caixaInput1">
                        <i class="fa-solid fa-list"></i>
                        <label for="descricao">Descreva sua deficiência e se precisa de alguma adaptação no trabalho.</label>
                        <br>
                        <textarea name="" class="textarea" id="decricao"></textarea>
                    </div>
                </div>

                <div class="botao">
                    <button class="button">Salvar alterações</button>
                </div>
            </form>
            
        </div>
    </div>
    
    
</body>
</html>
